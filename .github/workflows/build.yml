name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip and Build APK
        run: |
          unzip -o "*.zip"
          cd PDF2Word-AI/android-app
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-APK
          path: PDF2Word-AI/android-app/app/build/outputs/apk/debug/*.apk
